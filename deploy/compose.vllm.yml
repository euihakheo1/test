# Inference stays on the private Compose network: no host port is published.
services:
  api:
    environment:
      JETTAE_LLM_MODE: local
      JETTAE_LLM_PROVIDER: vllm
      JETTAE_VLLM_BASE_URL: http://vllm:8001/v1
      JETTAE_VLLM_MODEL: Qwen3-4B-Instruct-2507-cdbee75
      JETTAE_VLLM_API_KEY: ${JETTAE_VLLM_API_KEY:?set JETTAE_VLLM_API_KEY}
  worker:
    environment:
      JETTAE_LLM_MODE: local
      JETTAE_LLM_PROVIDER: vllm
      JETTAE_VLLM_BASE_URL: http://vllm:8001/v1
      JETTAE_VLLM_MODEL: Qwen3-4B-Instruct-2507-cdbee75
      JETTAE_VLLM_API_KEY: ${JETTAE_VLLM_API_KEY:?set JETTAE_VLLM_API_KEY}
      JETTAE_LLM_CACHE_DIR: /data/llm_cache
      JETTAE_LLM_LOCAL_CACHE: "0"
    volumes:
      - llm_cache:/data/llm_cache
    depends_on:
      vllm:
        condition: service_healthy
  vllm:
    image: vllm/vllm-openai:v0.30.0
    environment:
      VLLM_API_KEY: ${JETTAE_VLLM_API_KEY:?set JETTAE_VLLM_API_KEY}
    command:
      - ${JETTAE_VLLM_WEIGHTS:-Qwen/Qwen3-4B-Instruct-2507}
      - --served-model-name
      - Qwen3-4B-Instruct-2507-cdbee75
      - --revision
      - ${JETTAE_VLLM_REVISION:-cdbee75f17c01a7cc42f958dc650907174af0554}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --dtype
      - half
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "2"
      - --gpu-memory-utilization
      - "0.85"
      - --enforce-eager
      - --generation-config
      - vllm
      - --disable-log-requests
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 600s
      retries: 30
    restart: unless-stopped
volumes:
  llm_cache:
  model_cache:
