[project]
name = "jettae"
version = "0.1.0"
description = "제때받기: 정산 문서와 입금을 연결해 차액과 지급 지연을 확인하는 Agent"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # .env loading (jettae.config.load_env); docs/deps/backend-security.txt
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "lxml>=5.2",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "holidays>=0.50",
    "charset-normalizer>=3.3",
    "mcp>=1.2",
    # used directly, previously only transitive (docs/deps/llm-agents.txt)
    "jsonschema>=4.20",
    "pypdfium2>=4.0",
    "pillow>=10",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
agents = ["langgraph>=0.2"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
jettae = "jettae.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jettae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# jettae_testenv: drop JETTAE_*/provider variables and any .env before collection (hermetic runs)
pythonpath = ["tests/_plugins"]
addopts = "-ra -p jettae_testenv"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
